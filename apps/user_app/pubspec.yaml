name: user_app
description: Restricted scanner-only cross-platform application. QR generation and admin tools are strictly prohibited.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_core:
    path: ../../packages/qr_core
  qr_scanner_engine:
    path: ../../packages/qr_scanner_engine
  qr_design_system:
    path: ../../packages/qr_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
